<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>A-Frame WebAR Demo</title>
  <!-- A-Frame 本体 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <!-- iPhone/Android両対応のARライブラリ (AR.js) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <!-- 
    loading-screen="enabled: false" で青いローディング画面を強制解除
    embedded arjs でカメラを自動起動
  -->
  <a-scene loading-screen="enabled: false" embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-light type="directional" color="white" intensity="0.8" position="-1 1 2"></a-light>
    <a-light type="ambient" color="white" intensity="0.5"></a-light>

    <!-- 
      「hiro」マーカー（画面や紙に映したマーカー）をかざすと3Dが表示される設定
    -->
    <a-marker preset="hiro">
      <!-- 3Dオブジェクト（立方体） -->
      <a-box
        color="#0095DD"
        rotation="20 40 0"
        position="0 0.5 0"
        scale="0.5 0.5 0.5"
        animation="property: rotation; from: 20 0 0; to: 20 360 0; dir: alternate; loop: true; dur: 4000; easing: easeInOutQuad;">
      </a-box>

      <!-- 3Dオブジェクト（ドーナツ型） -->
      <a-entity
        geometry="primitive: torus; radius: 0.3; radiusTubular: 0.05;"
        material="color: #EAEFF2; roughness: 0.1; metalness: 0.5;"
        rotation="10 0 0"
        position="-0.8 0.5 0"
        scale="0.5 0.5 0.5"
        animation="property: scale; to: 0.5 0.25 0.5; direction: alternate; dur: 2000; loop: true; easing: linear;">
      </a-entity>
    </a-marker>

    <!-- カメラ定義 -->
    <a-entity camera></a-entity>

  </a-scene>

</body>

</html>
