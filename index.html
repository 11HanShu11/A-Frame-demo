<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Invader Demo - Object Pooling</title>

  <!-- 安定版 A-Frame 1.3.0 & AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    /* UI Overlay */
    #ui-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 9999;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 20px; box-sizing: border-box; font-family: Arial, sans-serif;
    }
    .status-bar {
      background: rgba(0, 0, 0, 0.6); color: #fff; padding: 10px 18px;
      border-radius: 20px; font-weight: bold; font-size: 16px;
      display: flex; justify-content: space-between; align-items: center;
      backdrop-filter: blur(4px);
    }
    .badge {
      background: #ff4757; color: white; padding: 4px 10px;
      border-radius: 12px; font-size: 12px;
    }
    .badge.active { background: #2ed573; }
    #shoot-btn {
      pointer-events: auto; align-self: center; margin-bottom: 20px;
      width: 90px; height: 90px; border-radius: 50%;
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      border: 4px solid #ffffff; color: white; font-size: 18px;
      font-weight: bold; box-shadow: 0 8px 15px rgba(0,0,0,0.3);
      cursor: pointer; outline: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #shoot-btn:active { transform: scale(0.9); background: linear-gradient(135deg, #ff6b81, #ff4757); }
  </style>

  <!-- ==========================================
       A-Frame コンポーネントの定義 (ECS & プーリング)
  =========================================== -->
  <script>
    // 1. マーカーに滑らかに追従するコンポーネント
    AFRAME.registerComponent('world-aligner', {
      schema: { marker: { type: 'selector' } },
      init: function () {
        this.isTracked = false;
        this.targetPos = new THREE.Vector3();
        this.targetQuat = new THREE.Quaternion();
        const marker = this.data.marker;
        const uiStatus = document.getElementById('marker-status');

        marker.addEventListener('markerFound', () => {
          this.isTracked = true;
          uiStatus.textContent = 'TRACKED';
          uiStatus.classList.add('active');
        });
        marker.addEventListener('markerLost', () => {
          this.isTracked = false;
          uiStatus.textContent = 'SEARCHING';
          uiStatus.classList.remove('active');
        });
      },
      tick: function () {
        if (this.isTracked) {
          this.data.marker.object3D.getWorldPosition(this.targetPos);
          this.data.marker.object3D.getWorldQuaternion(this.targetQuat);
          this.el.object3D.position.lerp(this.targetPos, 0.1);
          this.el.object3D.quaternion.slerp(this.targetQuat, 0.1);
        }
      }
    });

    // 2. 敵の挙動を管理するコンポーネント
    AFRAME.registerComponent('enemy-behavior', {
      init: function () {
        this.isAlive = true;
        this.enemyMesh = this.el.querySelector('#enemy');
        this.startColor = this.enemyMesh.getAttribute('color');
      },
      tick: function (time) {
        if (this.isAlive) {
          this.el.object3D.position.y = 0.3 + Math.sin(time * 0.003) * 0.1;
        }
      },
      hit: function () {
        if (!this.isAlive) return;
        this.isAlive = false;

        this.el.sceneEl.emit('enemy-hit');

        this.enemyMesh.setAttribute('color', '#ffbe76');
        this.enemyMesh.setAttribute('scale', '0.01 0.01 0.01');

        setTimeout(() => {
          const randomX = (Math.random() - 0.5) * 0.8;
          const randomZ = (Math.random() - 0.5) * 0.8;
          this.el.setAttribute('position', `${randomX} 0.3 ${randomZ}`);

          this.enemyMesh.setAttribute('color', this.startColor);
          this.enemyMesh.setAttribute('scale', '0.25 0.25 0.25');
          this.isAlive = true;
        }, 1500);
      }
    });

    // 3. 弾の移動と当たり判定（オブジェクトプーリング対応）
    AFRAME.registerComponent('bullet-behavior', {
      schema: { speed: { default: 0.15 } },
      init: function () {
        this.active = false; // 飛んでいる最中かどうか
        this.distance = 0;
        this.dir = new THREE.Vector3();
        this.enemyEl = document.getElementById('enemy-group');
        this.enemyPos = new THREE.Vector3();
      },
      // 発射指令を受け取るメソッド
      fire: function (pos, dir) {
        this.el.object3D.position.copy(pos); // カメラの位置へ移動
        this.dir.copy(dir); // 飛ぶ方向をセット
        this.distance = 0;
        this.active = true; // 稼働フラグON
        this.el.setAttribute('visible', 'true'); // 姿を現す
      },
      // 回収（非アクティブ化）メソッド
      deactivate: function () {
        this.active = false; // 稼働フラグOFF
        this.el.setAttribute('visible', 'false'); // 透明にして待機
      },
      tick: function () {
        if (!this.active) return; // 待機中の弾はここで処理をストップ（計算コスト0）

        this.el.object3D.position.addScaledVector(this.dir, this.data.speed);
        this.distance += this.data.speed;

        const enemyBehavior = this.enemyEl.components['enemy-behavior'];
        if (enemyBehavior && enemyBehavior.isAlive) {
          this.enemyEl.querySelector('#enemy').object3D.getWorldPosition(this.enemyPos);
          if (this.el.object3D.position.distanceTo(this.enemyPos) < 0.3) {
            enemyBehavior.hit();
            this.deactivate(); // DOMから削除せず、プールに回収
            return;
          }
        }

        if (this.distance > 10) {
          this.deactivate(); // 遠くまで飛んだらプールに回収
        }
      }
    });

    // 4. ゲーム全体の進行・UI連携（プールの生成）
    AFRAME.registerComponent('game-manager', {
      init: function () {
        this.score = 0;
        this.scoreText = document.getElementById('score-text');
        this.shootBtn = document.getElementById('shoot-btn');
        this.cameraEl = document.getElementById('main-camera');
        
        // 弾のプールを作成
        this.poolSize = 15; // 15発の弾を使い回す
        this.bullets = [];
        
        for (let i = 0; i < this.poolSize; i++) {
          const bullet = document.createElement('a-sphere');
          bullet.setAttribute('color', '#ffda79');
          bullet.setAttribute('radius', '0.04');
          bullet.setAttribute('visible', 'false'); // 最初は見えない状態で
          bullet.setAttribute('bullet-behavior', '');
          this.el.appendChild(bullet); // シーンに追加しておく
          this.bullets.push(bullet); // 配列で管理
        }

        this.shootBtn.addEventListener('click', () => {
          // プールの中から「現在休んでいる（!active）」弾を1つ探す
          const availableBullet = this.bullets.find(b => {
             const comp = b.components['bullet-behavior'];
             return comp && !comp.active;
          });

          // 休んでいる弾があれば発射処理を行う
          if (availableBullet) {
            const camPos = new THREE.Vector3();
            const camDir = new THREE.Vector3();
            
            this.cameraEl.object3D.getWorldPosition(camPos);
            this.cameraEl.object3D.getWorldDirection(camDir);
            camDir.negate();
            
            // 弾コンポーネントのfire()を呼び出して発射！
            availableBullet.components['bullet-behavior'].fire(camPos, camDir);
          }
        });

        this.el.addEventListener('enemy-hit', () => {
          this.score += 100;
          this.scoreText.textContent = this.score;
        });
      }
    });
  </script>
</head>

<body style="margin: 0px; overflow: hidden;">

  <!-- 2D UI画面 -->
  <div id="ui-container">
    <div class="status-bar">
      <div>SCORE: <span id="score-text">0</span></div>
      <div>MARKER: <span id="marker-status" class="badge">SEARCHING</span></div>
    </div>
    <button id="shoot-btn">BEAM!</button>
  </div>

  <a-scene game-manager embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">

    <!-- ★ここを差し替え★ -->
  <!-- <a-marker id="hiro-marker" preset="hiro"></a-marker> -->
    
　<!-- IDを追加し、タグを正しく閉じる形に修正 -->
  <a-marker id="hiro-marker" type="pattern" url="pattern-DOLL.patt"></a-marker>

    <a-entity id="game-world" position="0 0 -1.5" world-aligner="marker: #hiro-marker">
      
      <a-cylinder color="#00d2d3" height="0.01" radius="0.5" opacity="0.4" wireframe="true"></a-cylinder>

      <a-entity id="enemy-group" position="0 0.3 0" enemy-behavior>
        <a-box id="enemy" color="#ff4757" scale="0.25 0.25 0.25"
               animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear;">
        </a-box>
      </a-entity>

    </a-entity>

    <a-entity id="main-camera" camera position="0 1.6 0">
      <a-entity position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.018"
                material="color: #ffffff; shader: flat; opacity: 0.6">
      </a-entity>
    </a-entity>

  </a-scene>

</body>

</html>
